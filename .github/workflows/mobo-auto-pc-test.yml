
name: MoBo Push - Auto PC Test


on:
  # QA-046D-4 | staging QA code commit -> automatic PREVIEW-only checks
  # Not a scheduled push. No FCM send or Firestore writes.
  push:
    branches:
      - staging
    paths:
      - 'scripts/mobo-auto-*.cjs'
      - 'scripts/mobo-scheduler-clock.cjs'
      - 'scripts/mobo-push-dedupe.cjs'
      - 'scripts/mobo-live-guard.cjs'
      - 'scripts/mobo-dispatch-kind.cjs'
      - 'scripts/mobo-scheduler-tick-check.cjs'
      - 'scripts/mobo-netlify-preview-adapter.cjs'
      - '.github/workflows/mobo-auto-pc-test.yml'
  workflow_dispatch:
    inputs:
      execution_profile:
        description: '일반 수동 QA / 외부 스케줄러 읽기 전용'
        required: true
        default: 'MANUAL'
        type: choice
        options:
          - MANUAL
          - EXTERNAL_PREVIEW

      target_device:
        description: '테스트할 기기'
        required: true
        default: 'GALAXY'
        type: choice
        options:
          - GALAXY
          - PC


      preview_clock:
        description: '알림 계산 시간'
        required: true
        default: 'NOW'
        type: choice
        options:
          - NOW
          - TODAY_20_05
          - TODAY_22_05
          - TODAY_22_35

      notification_kind:
        description: '발송할 알림 종류'
        required: true
        default: 'SCHEDULE'
        type: choice
        options:
          - SCHEDULE
          - SERIAL
          - EXPIRE
          - ATTENDANCE
      run_mode:

        description: '실행 모드'
        required: true
        default: 'PREVIEW'
        type: choice
        options:
          - PREVIEW
          - LIVE

      live_confirm:
        description: '실제 발송 승인'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'

permissions:
  contents: read

concurrency:
  group: mobo-auto-pc-test
  cancel-in-progress: false

jobs:
  auto-pc-test:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and attendance dedupe
        run: |
          node --check scripts/mobo-auto-dispatch.cjs
          node --check scripts/mobo-push-dedupe.cjs
          node scripts/mobo-push-dedupe.cjs

      - name: Check MoBo scheduler clock
        run: |
          node --check scripts/mobo-scheduler-clock.cjs
          node scripts/mobo-scheduler-clock.cjs

      - name: Check 5-minute polling and duplicate claims (memory only)
        run: |
          node --check scripts/mobo-auto-cadence-test.cjs
          node scripts/mobo-auto-cadence-test.cjs

      - name: Check LIVE safety guards (memory only)
        run: |
          node --check scripts/mobo-live-guard.cjs
          node scripts/mobo-live-guard.cjs

      - name: Check dispatch kind isolation (memory only)
        run: |
          node --check scripts/mobo-dispatch-kind.cjs
          node scripts/mobo-dispatch-kind.cjs

      - name: Check runner UTC KST cadence and delayed starts (memory only)
        run: |
          node --check scripts/mobo-scheduler-tick-check.cjs
          node scripts/mobo-scheduler-tick-check.cjs

      - name: Check external preview trigger contract (memory only)
        run: |
          node --check scripts/mobo-auto-external-trigger.cjs
          node scripts/mobo-auto-external-trigger.cjs

      - name: Check external workflow / entrypoint contract (no network)
        run: |
          node --check scripts/mobo-auto-workflow-contract-test.cjs
          node scripts/mobo-auto-workflow-contract-test.cjs

      - name: Check Netlify scheduled QA adapter (memory only)
        run: |
          node --check scripts/mobo-netlify-preview-adapter.cjs
          node scripts/mobo-netlify-preview-adapter.cjs

      - name: Check uncertain FCM outcomes and persistent dedupe (memory only)
        run: |
          node --check scripts/mobo-auto-send-result.cjs
          node scripts/mobo-auto-send-result.cjs

      - name: Check delivery claim audit (memory only)
        run: |
          node --check scripts/mobo-auto-claim-audit.cjs
          node scripts/mobo-auto-claim-audit.cjs

      - name: Check single-UID Firebase fetch scope (memory only)
        run: |
          node --check scripts/mobo-auto-source-scope.cjs
          node scripts/mobo-auto-source-scope.cjs

      - name: Check bounded multiuser pages, concurrency and time budget (memory only)
        run: |
          node --check scripts/mobo-auto-multiuser-batch.cjs
          node scripts/mobo-auto-multiuser-batch.cjs

      - name: Check per-tick resume checkpoint and no duplicate claims (memory only)
        run: |
          node --check scripts/mobo-auto-resume-checkpoint.cjs
          node scripts/mobo-auto-resume-checkpoint.cjs

      - name: Check Firestore checkpoint transaction and restart recovery (memory only)
        run: |
          node --check scripts/mobo-auto-firestore-checkpoint.cjs
          node scripts/mobo-auto-firestore-checkpoint.cjs

      - name: Check transactional lease ownership and concurrent batch (memory only)
        run: |
          node --check scripts/mobo-auto-run-lease.cjs
          node scripts/mobo-auto-run-lease.cjs

      - name: Check full synthetic push pipeline integration (no remote calls)
        run: |
          node --check scripts/mobo-auto-pipeline-integration.cjs
          node scripts/mobo-auto-pipeline-integration.cjs

      - name: Verify release gate and staging safety (static, fail closed)
        run: |
          node --check scripts/mobo-auto-release-gate.cjs
          node scripts/mobo-auto-release-gate.cjs

      - name: Check scoped server-to-Netlify PREVIEW contract (memory only)
        run: |
          node --check scripts/mobo-auto-preview-runtime.cjs
          node scripts/mobo-auto-preview-runtime.cjs

      - name: Check scheduled PREVIEW timing and overlapping invocations (memory only)
        run: |
          node --check scripts/mobo-auto-scheduled-preview-guard.cjs
          node scripts/mobo-auto-scheduled-preview-guard.cjs

      - name: Check cross-instance lease takeover and bounded batch resume (memory only)
        run: |
          node --check scripts/mobo-auto-cross-instance-budget.cjs
          node scripts/mobo-auto-cross-instance-budget.cjs

      - name: Check checkpoint transaction fencing vs expired owners (memory only)
        run: |
          node --check scripts/mobo-auto-fenced-checkpoint.cjs
          node scripts/mobo-auto-fenced-checkpoint.cjs

      - name: Check QA runtime environment and legacy workflow risks (static)
        run: |
          node --check scripts/mobo-auto-runtime-preflight.cjs
          node scripts/mobo-auto-runtime-preflight.cjs

      - name: Check scoped Firestore read-only transaction contract (memory only)
        run: |
          node --check scripts/mobo-auto-readonly-transaction.cjs
          node scripts/mobo-auto-readonly-transaction.cjs

      - name: Check safe legacy manual workflow alternatives (memory only)
        run: |
          node --check scripts/mobo-auto-legacy-migration-contract.cjs
          node scripts/mobo-auto-legacy-migration-contract.cjs

      - name: Verify isolated Firestore write-probe contract (memory only)
        run: |
          node --check scripts/mobo-auto-write-probe-contract.cjs
          node scripts/mobo-auto-write-probe-contract.cjs

      - name: Check one-shot approved QA write preflight (memory only)
        run: |
          node --check scripts/mobo-auto-remote-write-once.cjs
          node scripts/mobo-auto-remote-write-once.cjs

      - name: Check undeployed Netlify five-minute schedule handoff (memory only)
        run: |
          node --check scripts/mobo-auto-netlify-cutover-contract.cjs
          node scripts/mobo-auto-netlify-cutover-contract.cjs

      - name: Check independent QA Netlify site boundary (memory only)
        run: |
          node --check scripts/mobo-auto-qa-site-boundary.cjs
          node scripts/mobo-auto-qa-site-boundary.cjs

      - name: Verify independent QA Netlify runtime identity (offline)
        run: |
          node --check scripts/mobo-auto-netlify-runtime-identity.cjs
          node scripts/mobo-auto-netlify-runtime-identity.cjs

      - name: Check QA Netlify site setup readiness and safe staging config (offline)
        run: |
          node --check scripts/mobo-auto-site-setup-readiness.cjs
          node scripts/mobo-auto-site-setup-readiness.cjs

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13


      # QA-046D-26 | scoped QA Firestore read-only transaction; no writes
      - name: Verify QA Firebase read-only transaction on four documents
        if: github.event_name == 'push'
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_NETLIFY_QA_PREVIEW: 'YES'
          MOBO_AUTO_MODE: PREVIEW
          MOBO_AUTO_KIND: SCHEDULE
          MOBO_PREVIEW_CLOCK: NOW
          MOBO_AUTO_LIVE_CONFIRM: 'NO'
          MOBO_QA_TRANSACTION_MODE: READ_ONLY
        run: |
          test "$GITHUB_REF" = "refs/heads/staging"
          node scripts/mobo-auto-readonly-transaction.cjs --qa-read

      # QA-046D-21 | Live QA Firebase read only, specifically one QA UID
      - name: Read scoped QA Firebase through server PREVIEW entrypoint
        if: github.event_name == 'push'
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_NETLIFY_QA_PREVIEW: 'YES'
          MOBO_AUTO_MODE: PREVIEW
          MOBO_AUTO_KIND: SCHEDULE
          MOBO_PREVIEW_CLOCK: NOW
          MOBO_AUTO_LIVE_CONFIRM: 'NO'
        run: |
          test "$GITHUB_REF" = "refs/heads/staging"
          node scripts/mobo-auto-preview-runtime.cjs --qa-read

      # QA-046D-13 | QA Galaxy claim records: today/yesterday, read only
      # No UID/token/hashed claim key in logs. No writes, deletes or retry.
      - name: Audit recent QA delivery claims (read only)
        if: github.event_name == 'push'
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_CLAIM_AUDIT_MODE: READ_ONLY
          MOBO_AUTO_MODE: PREVIEW
          MOBO_AUTO_LIVE_CONFIRM: 'NO'
        run: |
          test "$GITHUB_REF" = "refs/heads/staging"
          node scripts/mobo-auto-claim-audit.cjs --qa-read

      # QA-046D-4 | GitHub staging push: enforced PREVIEW-only, QA Galaxy UID
      - name: Auto PREVIEW after staging QA commit (no push sent)
        if: github.event_name == 'push'
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_AUTO_MODE: PREVIEW
          MOBO_AUTO_KIND: SCHEDULE
          MOBO_PREVIEW_CLOCK: NOW
          MOBO_AUTO_LIVE_CONFIRM: 'NO'
        run: |
          test "$GITHUB_REF" = "refs/heads/staging"
          test "$GITHUB_EVENT_NAME" = "push"
          node scripts/mobo-auto-dispatch.cjs

      # QA-046D-8 | 외부 workflow_dispatch는 강제 PREVIEW 경로만
      # 외부 스케줄러와 GitHub API 인증은 아직 연결하지 않음
      - name: External scheduler PREVIEW only (never sends push)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_profile == 'EXTERNAL_PREVIEW' }}
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_EXTERNAL_PROFILE: ${{ inputs.execution_profile }}
          MOBO_EXTERNAL_TARGET: ${{ inputs.target_device }}
          MOBO_EXTERNAL_CLOCK: ${{ inputs.preview_clock }}
          MOBO_EXTERNAL_KIND: ${{ inputs.notification_kind }}
          MOBO_EXTERNAL_MODE: ${{ inputs.run_mode }}
          MOBO_EXTERNAL_CONFIRM: ${{ inputs.live_confirm }}
          MOBO_AUTO_MODE: PREVIEW
          MOBO_AUTO_KIND: SCHEDULE
          MOBO_PREVIEW_CLOCK: NOW
          MOBO_AUTO_LIVE_CONFIRM: 'NO'
        run: |
          node scripts/mobo-auto-external-trigger.cjs --check-invocation
          node scripts/mobo-auto-dispatch.cjs

      # QA-046D-10 | Actions:write 권한을 가진 외부 계정도
      # 입력값만 바꿔 LIVE를 실행하지 못하도록 staging에서 LIVE 잠금
      # 실제 기기 LIVE 시험은 별도 승인 및 환경 보호 설정 이후 복원
      - name: Reject manual LIVE or YES confirmation (locked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_profile == 'MANUAL' && (inputs.run_mode != 'PREVIEW' || inputs.live_confirm != 'NO') }}
        run: |
          echo "::error::QA-046D-10: staging 수동 LIVE가 잠겨 있습니다. PREVIEW/NO만 허용합니다."
          exit 1

      - name: Run Galaxy automatic notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_profile == 'MANUAL' && inputs.run_mode == 'PREVIEW' && inputs.live_confirm == 'NO' && inputs.target_device == 'GALAXY' }}
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_AUTO_MODE: ${{ inputs.run_mode }}
          MOBO_AUTO_KIND: ${{ inputs.notification_kind }}
          MOBO_PREVIEW_CLOCK: ${{ inputs.preview_clock }}          
          MOBO_AUTO_LIVE_CONFIRM: ${{ inputs.live_confirm }}
        run: node scripts/mobo-auto-dispatch.cjs

      - name: Run PC automatic notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_profile == 'MANUAL' && inputs.run_mode == 'PREVIEW' && inputs.live_confirm == 'NO' && inputs.target_device == 'PC' }}
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_AUTO_TEST_UID: ${{ secrets.MOBO_QA_TEST_UID }}
          MOBO_AUTO_MODE: ${{ inputs.run_mode }}
          MOBO_AUTO_KIND: ${{ inputs.notification_kind }}
          MOBO_PREVIEW_CLOCK: ${{ inputs.preview_clock }}
          MOBO_AUTO_LIVE_CONFIRM: ${{ inputs.live_confirm }}
        run: node scripts/mobo-auto-dispatch.cjs

