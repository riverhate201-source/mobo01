
name: MoBo Push - Test Notification

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '테스트할 기기 선택'
        required: true
        default: 'GALAXY'
        type: choice
        options:
          - GALAXY
          - PC

      send_mode:
        description: '테스트 알림 발송 방식'
        required: true
        default: 'DRY_RUN'
        type: choice
        options:
          - DRY_RUN
          - SEND_ONCE
      message_kind:
        description: '테스트 알림 종류'
        required: true
        default: 'STANDARD'
        type: choice
        options:
          - STANDARD
          - ATTENDANCE_QA
          - SERIAL_TITLES_QA

      confirm_serial_titles_send:
        description: '작품명 SEND_ONCE 전용: 실제 갤럭시 1건 발송 승인'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
permissions:
  contents: read

# QA 수동 테스트 동시 실행 방지 (각 실행당 최대 1회 발송)
concurrency:
  group: mobo-test-push-single-galaxy
  cancel-in-progress: false

jobs:
  test-notification:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check test push syntax
        run: node --check scripts/mobo-test-push.cjs
      - name: Guard manually approved serial title delivery
        if: ${{ inputs.message_kind == 'SERIAL_TITLES_QA' && inputs.send_mode == 'SEND_ONCE' }}
        env:
          APPROVAL: ${{ inputs.confirm_serial_titles_send }}
          DEVICE: ${{ inputs.target_device }}
        run: |
          test "$APPROVAL" = 'YES'
          test "$DEVICE" = 'GALAXY'

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13

      - name: Check serial title dry-run payload (offline, no FCM)
        run: node scripts/mobo-test-push.cjs --qa-serial-payload-self-test

      
      # PC 테스트
      - name: Test notification - PC
        if: ${{ inputs.target_device == 'PC' }}
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_TEST_UID: ${{ secrets.MOBO_QA_TEST_UID }}
          MOBO_SEND_MODE: ${{ inputs.send_mode }}
          MOBO_TEST_MESSAGE_KIND: ${{ inputs.message_kind }}
          MOBO_TEST_DEVICE: ${{ inputs.target_device }}
          MOBO_QA_TITLES_SEND_CONFIRM: ${{ inputs.confirm_serial_titles_send }}
        run: node scripts/mobo-test-push.cjs

      # Galaxy 테스트
      - name: Test notification - Galaxy
        if: ${{ inputs.target_device == 'GALAXY' }}
        env:
          MOBO_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MOBO_QA_FIREBASE_SERVICE_ACCOUNT }}
          MOBO_TEST_UID: ${{ secrets.MOBO_QA_GALAXY_TEST_UID }}
          MOBO_SEND_MODE: ${{ inputs.send_mode }}
          MOBO_TEST_MESSAGE_KIND: ${{ inputs.message_kind }}
          MOBO_TEST_DEVICE: ${{ inputs.target_device }}
          MOBO_QA_TITLES_SEND_CONFIRM: ${{ inputs.confirm_serial_titles_send }}
        run: node scripts/mobo-test-push.cjs
